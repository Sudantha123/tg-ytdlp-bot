name: Run tg-ytdlp-bot (direct Python runner)

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort and may start late.
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tg-ytdlp-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare configuration and cookies
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
          COOKIE_TXT: ${{ secrets.COOKIE_TXT }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIG_PY:-}" ]; then
            echo "::error::Add repository secret CONFIG_PY containing the complete CONFIG/config.py content."
            exit 1
          fi

          mkdir -p CONFIG docker/configuration-webserver/site/cookies
          printf '%s\n' "$CONFIG_PY" > CONFIG/config.py
          cp .env.example .env
          sed -i 's/^TZ=.*/TZ=Asia\/Colombo/' .env

          if [ -n "${COOKIE_TXT:-}" ]; then
            printf '%s\n' "$COOKIE_TXT" > docker/configuration-webserver/site/cookies/youtube.txt
          fi

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg mediainfo rsync git ca-certificates fontconfig \
            fonts-noto-core fonts-noto-extra fonts-kacst-one \
            fonts-noto-cjk fonts-indic fonts-noto-color-emoji libass9
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Python and install requirements
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start only supporting services (no app image build)
        run: |
          set -euo pipefail
          docker compose up -d bgutil-provider configuration-webserver
          docker compose ps

      - name: Run magic.py directly for 5 hours 50 minutes
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 350m python -u magic.py
          status=$?
          set -e

          # A normal timeout at the end of the scheduled session is expected.
          if [ "$status" -eq 124 ] || [ "$status" -eq 130 ]; then
            echo "Scheduled run window ended."
            exit 0
          fi

          exit "$status"

      - name: Show bot logs if available
        if: always()
        run: |
          if [ -f bot.log ]; then tail -n 150 bot.log; fi
          docker compose logs --tail=100 bgutil-provider configuration-webserver || true

      - name: Stop supporting services
        if: always()
        run: docker compose down --remove-orphans || true
